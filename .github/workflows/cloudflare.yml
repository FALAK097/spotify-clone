name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build with OpenNext
        run: pnpm run build:cf
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_J65qUgzWMtuk@ep-broad-sky-b4d44xxi-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || '901c7ec67ba9d35cdf486c85b5215e660a3c30cc5e499fd996b7299190bfffb3' }}
          BETTER_AUTH_URL: https://spotify.falakgala.dev

      - name: Deploy to Cloudflare (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Preview (Pull Request)
        if: github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run

